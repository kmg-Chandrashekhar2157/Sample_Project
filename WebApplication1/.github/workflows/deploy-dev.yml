name: Deploy DEV IIS

on:
  push:
    branches:
      - develop

env:
  PROJECT_PATH: WebApplication1/WebApplication1.csproj
  CONFIGURATION: Release
  IIS_SITE: MyApp-Dev
  DEPLOY_PATH: C:\inetpub\wwwroot\MyApp-Dev

jobs:

  build-and-deploy:

    runs-on: [self-hosted, windows, iis]

    steps:

      # -------------------------
      # 1. Checkout
      # -------------------------
      - name: Checkout Code
        uses: actions/checkout@v4


      # -------------------------
      # 2. Setup .NET 10
      # -------------------------
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'


      # -------------------------
      # 3. Check environment
      # -------------------------
      - name: Check Environment
        shell: powershell
        run: |
          Write-Host "================================="
          Write-Host "BUILD ENVIRONMENT"
          Write-Host "================================="

          Write-Host "Machine:"
          hostname

          Write-Host "User:"
          whoami

          Write-Host ".NET:"
          dotnet --version

          Write-Host "================================="


      # -------------------------
      # 4. Restore
      # -------------------------
      - name: Restore
        shell: powershell
        run: |
          dotnet restore "${{ env.PROJECT_PATH }}"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Restore failed"
              exit 1
          }


      # -------------------------
      # 5. Build
      # -------------------------
      - name: Build
        shell: powershell
        run: |
          dotnet build "${{ env.PROJECT_PATH }}" `
            --configuration "${{ env.CONFIGURATION }}" `
            --no-restore

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Build failed"
              exit 1
          }


      # -------------------------
      # 6. Test
      # -------------------------
      - name: Test
        shell: powershell
        run: |
          dotnet test `
            --configuration "${{ env.CONFIGURATION }}" `
            --no-build

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Test failed"
              exit 1
          }


      # -------------------------
      # 7. Publish
      # -------------------------
      - name: Publish
        shell: powershell
        run: |

          if (Test-Path ".\publish") {
              Remove-Item ".\publish" -Recurse -Force
          }

          dotnet publish "${{ env.PROJECT_PATH }}" `
            --configuration "${{ env.CONFIGURATION }}" `
            --output ".\publish" `
            --no-restore

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Publish failed"
              exit 1
          }

          Write-Host "Published files:"
          Get-ChildItem ".\publish" -Recurse


      # -------------------------
      # 8. Deploy to IIS
      # -------------------------
      - name: Deploy to IIS DEV
        shell: powershell
        run: |

          Import-Module WebAdministration

          Write-Host "================================="
          Write-Host "IIS DEPLOYMENT STARTED"
          Write-Host "================================="

          Write-Host "IIS Site:"
          Write-Host "${{ env.IIS_SITE }}"

          Write-Host "Deployment Path:"
          Write-Host "${{ env.DEPLOY_PATH }}"

          # Check IIS site
          $site = Get-Website `
              -Name "${{ env.IIS_SITE }}" `
              -ErrorAction SilentlyContinue

          if ($null -eq $site) {
              Write-Error "IIS site '${{ env.IIS_SITE }}' does not exist."
              exit 1
          }

          Write-Host "IIS site found."

          # Create folder if required
          if (!(Test-Path "${{ env.DEPLOY_PATH }}")) {

              Write-Host "Creating deployment folder..."

              New-Item `
                -ItemType Directory `
                -Path "${{ env.DEPLOY_PATH }}" `
                -Force
          }

          # Stop website
          Write-Host "Stopping IIS site..."

          Stop-Website `
            -Name "${{ env.IIS_SITE }}" `
            -ErrorAction Stop

          Write-Host "IIS site stopped."

          # Copy published files
          Write-Host "Copying published files..."

          Copy-Item `
            ".\publish\*" `
            "${{ env.DEPLOY_PATH }}" `
            -Recurse `
            -Force `
            -ErrorAction Stop

          Write-Host "Files copied successfully."

          # Start website
          Write-Host "Starting IIS site..."

          Start-Website `
            -Name "${{ env.IIS_SITE }}" `
            -ErrorAction Stop

          Write-Host "IIS site started."

          # Verify
          $site = Get-Website `
            -Name "${{ env.IIS_SITE }}"

          Write-Host "================================="
          Write-Host "DEPLOYMENT SUCCESSFUL"
          Write-Host "================================="

          Write-Host "Site: $($site.Name)"
          Write-Host "State: $($site.State)"
          Write-Host "Path: ${{ env.DEPLOY_PATH }}"

          Write-Host "================================="